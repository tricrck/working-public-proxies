name: Proxy Checker

on:
  schedule:
    - cron: '0 */7 * * *'   # Runs every 7 hours
  push:
    branches: [ main ]
  workflow_dispatch:          # Allows manual runs from GitHub UI

jobs:
  check-proxies:
    runs-on: ubuntu-latest

    permissions:
      contents: write         # Needed to commit README.md back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run proxy checker
        run: python proxy_generator.py

      - name: Commit updated README
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add working_proxies.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update proxy rankings [skip ci]"
          git push